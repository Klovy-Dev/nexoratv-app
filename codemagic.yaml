# Build iOS de NexoraTV sur un Mac cloud Codemagic — aucun Mac requis de ton côté.
# Équivalent Flutter d'« EAS Build » : tout se pilote depuis Windows.
#
# ─── À FAIRE UNE SEULE FOIS (tout depuis le web, sans Mac) ────────────────────
#  1. App Store Connect > Users and Access > Integrations > App Store Connect API
#       → clé rôle « App Manager » ; noter Issuer ID + Key ID, télécharger le .p8
#  2. developer.apple.com > Identifiers : bundle ID com.gaby.nexoratv
#  3. App Store Connect > Apps > (+) : créer l'app (bundle com.gaby.nexoratv)
#  4. Codemagic > Team settings > Integrations > Developer Portal > Connect
#       → name=AppStoreConnect, Issuer ID, Key ID, .p8
#  5. Codemagic > Team settings > Global variables and secrets :
#       groupe « ios_signing » → variable CERTIFICATE_PRIVATE_KEY (Secure)
#       = clé RSA privée PEM (générée hors CI, réutilisée à chaque build pour
#         que le même certificat de distribution soit repris).
#  6. App Store Connect > l'app > TestFlight > Internal Testing : groupe « Internes »
#
# Au 1er build : le certificat de distribution (à partir de CERTIFICATE_PRIVATE_KEY)
# + le provisioning profile App Store sont créés. Builds suivants : réutilisés.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing            # fournit CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.gaby.nexoratv"
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Analyse + tests
        script: |
          flutter analyze
          flutter test
      - name: Signature (certificat + profil, créés au besoin)
        script: |
          keychain initialize
          # Reprend le certificat de distribution lié à CERTIFICATE_PRIVATE_KEY,
          # ou le crée (avec cette clé) s'il n'existe pas encore. Idem profil.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internes
      email:
        recipients:
          - klovy.off@gmail.com
        notify:
          success: true
          failure: true
