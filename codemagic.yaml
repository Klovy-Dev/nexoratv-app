# Build iOS de NexoraTV sur un Mac cloud Codemagic — aucun Mac requis de ton côté.
# Équivalent Flutter d'« EAS Build » : tout se pilote depuis Windows.
#
# ─── À FAIRE UNE SEULE FOIS (tout depuis le web, sans Mac) ────────────────────
#  1. App Store Connect > Users and Access > Integrations > App Store Connect API
#       → générer une clé, rôle « App Manager »
#       → noter : Issuer ID, Key ID, télécharger le fichier AuthKey_XXXX.p8
#  2. App Store Connect > Apps > (+) : créer l'app
#       Plateforme iOS · Bundle ID : com.gaby.nexoratv · SKU : nexoratv
#     (le bundle ID doit d'abord être enregistré sur
#      developer.apple.com > Identifiers — Codemagic peut le créer pour toi
#      à l'étape signature ci-dessous)
#  3. Codemagic > Team settings > Integrations > App Store Connect
#       → coller Issuer ID + Key ID + .p8   (nom de l'intégration : « AppStoreConnect »)
#  4. Codemagic > l'app > Settings > Code signing identities > iOS
#       → « Generate » : Codemagic crée le certificat de distribution
#         et le provisioning profile App Store pour com.gaby.nexoratv
#  5. Créer le groupe de testeurs « Internes » dans TestFlight (App Store Connect)
#
# Ensuite : bouton « Start new build ». Le .ipa part tout seul sur TestFlight.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gaby.nexoratv
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Analyse + tests
        script: |
          flutter analyze
          flutter test
      - name: Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Signature (profils Codemagic -> projet Xcode)
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internes
      email:
        recipients:
          - klovy.off@gmail.com
        notify:
          success: true
          failure: true
