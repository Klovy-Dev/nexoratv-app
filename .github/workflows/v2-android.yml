name: NexoraTV 2 - APK de test

# Chaque push sur la branche v2 compile l'APK (Fire TV Stick, Android TV, box)
# et le publie en pré-version GitHub, avec un lien direct pour Downloader.
# update.json n'est PAS modifié : les appareils en 1.x ne reçoivent rien tant
# que la 2.0.0 n'est pas publiée officiellement.
on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Plateforme Android 37.0
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Réglages Gradle pour runner CI
        # android/gradle.properties est calibré pour un PC à 6 Go (plafonds
        # mémoire bas) : trop juste pour un runner GitHub.
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
          org.gradle.daemon=false
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      - name: Clé de signature release (la même que la 1.x)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature Android absents (ANDROID_KEYSTORE_B64…)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/nexoratv-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../nexoratv-release.jks
          EOF

      - name: Build APK
        id: build
        run: |
          v="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          # 200 + numéro du build : toujours au-dessus de la 1.x installée,
          # et chaque APK de test remplace le précédent.
          code=$((200 + GITHUB_RUN_NUMBER))
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$v" --build-number="$code"
          mv build/app/outputs/flutter-apk/app-release.apk "NexoraTV-$v-test$GITHUB_RUN_NUMBER.apk"
          cp "NexoraTV-$v-test$GITHUB_RUN_NUMBER.apk" NexoraTV-v2-test.apk
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: NexoraTV-*.apk

      - name: Pré-version GitHub (lien direct pour le Stick)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-test-${{ github.run_number }}
          name: NexoraTV ${{ steps.build.outputs.version }} - test ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK de test de la nouvelle appli (branche v2), pas encore publiée aux utilisateurs.
            Commit ${{ github.sha }}.
          files: NexoraTV-*.apk
