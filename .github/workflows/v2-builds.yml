name: NexoraTV 2 - builds de test

# Chaque push sur la branche v2 compile l'APK (Fire TV Stick, Android TV, box)
# et l'installeur Windows, puis les publie ensemble en pré-version GitHub
# (lien direct pour Downloader sur le Stick).
# update.json n'est PAS modifié : les appareils en 1.x ne reçoivent rien tant
# que la 2.0.0 n'est pas publiée officiellement.
on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  # -------------------------------------------------- Vérifs
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - id: v
        run: |
          v="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------- Android
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Plateforme Android 37.0
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Réglages Gradle pour runner CI
        # android/gradle.properties est calibré pour un PC à 6 Go (plafonds
        # mémoire bas) : trop juste pour un runner GitHub.
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
          org.gradle.daemon=false
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      - name: Clé de signature release (la même que la 1.x)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature Android absents (ANDROID_KEYSTORE_B64…)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/nexoratv-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../nexoratv-release.jks
          EOF

      - name: Build APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # 200 + numéro du build : toujours au-dessus de la 1.x installée,
          # et chaque APK de test remplace le précédent.
          code=$((200 + GITHUB_RUN_NUMBER))
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$VERSION" --build-number="$code"
          mv build/app/outputs/flutter-apk/app-release.apk "NexoraTV-$VERSION-test$GITHUB_RUN_NUMBER.apk"
          cp "NexoraTV-$VERSION-test$GITHUB_RUN_NUMBER.apk" NexoraTV-v2-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NexoraTV-*.apk

  # -------------------------------------------------- Windows
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --build-name=${{ needs.check.outputs.version }} --build-number=${{ github.run_number }}

      - name: Installeur Inno Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Runtime Visual C++ joint à l'appli (comme installer\build.ps1) :
          # sans lui, NexoraTV ne démarre pas sur un PC qui ne l'a pas déjà.
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $release -Force }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\nexoratv.iss
          if ($LASTEXITCODE -ne 0) { throw "La création de l'installeur a échoué." }
          $n = $env:GITHUB_RUN_NUMBER
          Copy-Item "build\installer\NexoraTV-Setup-$env:VERSION.exe" "NexoraTV-Setup-$env:VERSION-test$n.exe"
          Copy-Item "build\installer\NexoraTV-Setup-$env:VERSION.exe" "NexoraTV-Setup-v2-test.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NexoraTV-Setup-*.exe

  # -------------------------------------------------- Pré-version
  publish:
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pré-version GitHub (liens directs)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-test-${{ github.run_number }}
          name: NexoraTV ${{ needs.check.outputs.version }} - test ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Builds de test de la nouvelle appli (branche v2), pas encore publiés aux utilisateurs.
            - Android / Fire TV : NexoraTV-${{ needs.check.outputs.version }}-test${{ github.run_number }}.apk
            - Windows : NexoraTV-Setup-${{ needs.check.outputs.version }}-test${{ github.run_number }}.exe
            Commit ${{ github.sha }}.
          files: |
            dist/android/*.apk
            dist/windows/*.exe
