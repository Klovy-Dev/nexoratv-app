name: Release NexoraTV

# Versions indépendantes par plateforme — on pousse un tag préfixé :
#   win-v2.1.0      -> build Windows uniquement
#   android-v1.5.0  -> build Android uniquement
#   v1.4.0          -> (ancien schéma) build Windows + Android
# iOS se release à part, via Codemagic (tag ios-v*).
on:
  push:
    tags:
      - "win-v*"
      - "android-v*"
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # -------------------------------------------------- Résolution du tag
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      do_windows: ${{ steps.p.outputs.do_windows }}
      do_android: ${{ steps.p.outputs.do_android }}
    steps:
      - id: p
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            win-v*)     plat=windows; version="${ref#win-v}";     dw=true;  da=false ;;
            android-v*) plat=android; version="${ref#android-v}"; dw=false; da=true  ;;
            v*)         plat=all;     version="${ref#v}";         dw=true;  da=true   ;;
            *) echo "::error::tag non reconnu : $ref"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "do_windows=$dw"
            echo "do_android=$da"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $ref -> plateforme=$plat version=$version"

  # -------------------------------------------------- Vérifs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # -------------------------------------------------- Windows
  windows:
    needs: [setup, check]
    if: needs.setup.outputs.do_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=${{ needs.setup.outputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Installeur Inno Setup
        shell: pwsh
        run: |
          $v = "${{ needs.setup.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer\nexoratv.iss
          # À la racine du workspace : actions/upload-artifact@v4 préserve les
          # sous-dossiers, ce qui cassait le glob plat `dist/windows/*.exe` du
          # job publish (le zip, déjà à la racine, n'avait pas ce problème).
          Copy-Item "installer\Output\NexoraTV-Setup-$v.exe" .
          # Copie au nom stable pour les liens « latest » :
          # github.com/<repo>/releases/latest/download/NexoraTV-Setup.exe
          Copy-Item "installer\Output\NexoraTV-Setup-$v.exe" "NexoraTV-Setup.exe"
      - name: Zip portable (secours)
        shell: pwsh
        run: |
          $v = "${{ needs.setup.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "NexoraTV-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            NexoraTV-Setup*.exe
            NexoraTV-*-windows-x64.zip

  # -------------------------------------------------- Android
  android:
    needs: [setup, check]
    if: needs.setup.outputs.do_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Réglages Gradle pour runner CI
        # android/gradle.properties est calibré pour une machine 4 Go (plafonds
        # mémoire bas) : sur les runners GitHub ça provoque un OOM Metaspace.
        # On relève les limites juste pour la CI.
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF
      - name: Clé de signature release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature Android absents (ANDROID_KEYSTORE_B64…)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/nexoratv-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../nexoratv-release.jks
          EOF
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.setup.outputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Rename
        run: |
          v="${{ needs.setup.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-release.apk "NexoraTV-$v.apk"
          # Nom stable pour les liens « latest » :
          # github.com/<repo>/releases/latest/download/NexoraTV.apk
          cp "NexoraTV-$v.apk" "NexoraTV.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NexoraTV*.apk

  # -------------------------------------------- Release + manifeste update.json
  publish:
    needs: [setup, check, windows, android]
    # windows / android peuvent être « skipped » selon le tag : on publie dès
    # que les vérifs passent et qu'aucun build lancé n'a échoué.
    if: >-
      ${{ !cancelled()
          && needs.check.result == 'success'
          && needs.windows.result != 'failure'
          && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Mettre à jour update.json (bloc de la plateforme publiée)
        run: |
          set -euo pipefail
          v="${{ needs.setup.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          notes="$(cat CHANGELOG_LATEST.md 2>/dev/null || echo "NexoraTV $v")"

          [ -f update.json ] || echo '{}' > update.json

          if [ "${{ needs.setup.outputs.do_windows }}" = "true" ]; then
            jq --arg v "$v" --arg url "$base/NexoraTV-Setup-$v.exe" --arg notes "$notes" \
              '.windows = {version:$v, url:$url, notes:$notes, mandatory:false}' \
              update.json > update.tmp && mv update.tmp update.json
          fi
          if [ "${{ needs.setup.outputs.do_android }}" = "true" ]; then
            jq --arg v "$v" --arg url "$base/NexoraTV-$v.apk" --arg notes "$notes" \
              '.android = {version:$v, url:$url, notes:$notes, mandatory:false}' \
              update.json > update.tmp && mv update.tmp update.json
          fi

          # Compat anciens clients (format à plat) : liens par plateforme tenus
          # à jour, et `version` à plat = la plus BASSE des deux -> un client
          # pré-migration ne se voit proposer une MAJ que lorsque les deux
          # plateformes l'ont dépassé (jamais de téléchargement trompeur).
          wv="$(jq -r '.windows.version // "0"' update.json)"
          av="$(jq -r '.android.version // "0"' update.json)"
          flat="$(printf '%s\n%s\n' "$wv" "$av" | sort -V | head -1)"
          jq --arg v "$flat" \
             --arg wu "$(jq -r '.windows.url // .windows_url // ""' update.json)" \
             --arg au "$(jq -r '.android.url // .android_url // ""' update.json)" \
             '.version=$v | .windows_url=$wu | .android_url=$au | .mandatory=false' \
             update.json > update.tmp && mv update.tmp update.json

          cp update.json /tmp/update.json
          echo "----- update.json -----"
          cat update.json
      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/android/*.apk
            update.json
      - name: Commit update.json sur main (sert de manifeste)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout -f main
          cp /tmp/update.json update.json
          git add update.json
          git commit -m "chore: update.json -> ${GITHUB_REF_NAME}" || exit 0
          git push origin main
