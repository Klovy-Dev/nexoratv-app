name: Release NexoraTV

# Déclenché en poussant un tag "v1.2.3".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # ---------------------------------------------------------------- Vérifs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ---------------------------------------------------------------- Windows
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: flutter build windows --release --build-name=${GITHUB_REF_NAME#v}
      - name: Installeur Inno Setup
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer\nexoratv.iss
      - name: Zip portable (secours)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "NexoraTV-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/Output/NexoraTV-Setup-*.exe
            NexoraTV-*-windows-x64.zip

  # ---------------------------------------------------------------- Android
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Clé de signature release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature Android absents (ANDROID_KEYSTORE_B64…)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/nexoratv-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../nexoratv-release.jks
          EOF
      - run: flutter build apk --release --build-name=${GITHUB_REF_NAME#v}
      - name: Rename
        run: |
          v="${GITHUB_REF_NAME#v}"
          mv build/app/outputs/flutter-apk/app-release.apk "NexoraTV-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NexoraTV-*.apk

  # ---------------------------------------------------------- Release + manifest
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Build update.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > /tmp/update.json <<EOF
          {
            "version": "$v",
            "notes": $(jq -Rs . < CHANGELOG_LATEST.md 2>/dev/null || echo "\"NexoraTV $v\""),
            "windows_url": "$base/NexoraTV-Setup-$v.exe",
            "android_url": "$base/NexoraTV-$v.apk",
            "mandatory": false
          }
          EOF
          cp /tmp/update.json update.json
          cat update.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/android/*.apk
            update.json
      - name: Commit update.json to main (sert de manifeste)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout -f main
          cp /tmp/update.json update.json
          git add update.json
          git commit -m "chore: update.json -> ${GITHUB_REF_NAME}" || exit 0
          git push origin main
