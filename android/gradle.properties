# Machine à faible RAM (~3 Go) : plafonds mémoire bas, sinon le daemon Gradle
# fait un OutOfMemoryError (« Native memory allocation (mmap) failed »).
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
